<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 100px;
        }
        #clock {
            font-size: 40px;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Digital Clock</h1>
    <div id="clock"></div>

    <script>
        function showTime() {
            let time = new Date();
            let h = time.getHours();
            let m = time.getMinutes();
            let s = time.getSeconds();

            // Add leading zero
            if (h < 10) h = "0" + h;
            if (m < 10) m = "0" + m;
            if (s < 10) s = "0" + s;

            document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;
        }

        setInterval(showTime, 1000);
    </script>

</body>
</html>
